# Render.com deployment blueprint.
# This is the configuration-of-record for the production environment:
# every environment-specific value lives here or in the Render
# dashboard's "Environment" tab, never in committed code.
services:
  - type: web
    name: bellbird-books
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        sync: false            # set manually in the Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: bellbird-db
          property: connectionString

databases:
  - name: bellbird-db
    plan: free
    postgresqlMajorVersion: 16
