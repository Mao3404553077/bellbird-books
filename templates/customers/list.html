{% extends "base.html" %}
{% block title %}Customers{% endblock %}
{% block content %}
<h1>Customers</h1>
<div class="toolbar">
  <form method="get">
    <input type="text" name="q" value="{{ q }}"
           placeholder="Search name, phone, email…" data-autosubmit>
    <button class="btn" type="submit">Search</button>
  </form>
  <a class="btn" href="{{ url_for('customers.new_customer') }}">+ Add customer</a>
</div>
<table>
  <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th></th></tr></thead>
  <tbody>
  {% for c in customers %}
    <tr>
      <td><a href="{{ url_for('customers.detail', customer_id=c.id) }}">{{ c.name }}</a></td>
      <td>{{ c.phone or '—' }}</td>
      <td>{{ c.email or '—' }}</td>
      <td>{{ c.orders.count() }} order(s)</td>
    </tr>
  {% else %}
    <tr><td colspan="4">No customers found.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
